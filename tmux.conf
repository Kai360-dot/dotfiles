# ~/.tmux.conf  — tmux 3.6, WSL2 / Windows Terminal

# ─── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix          # press C-Space twice to send literal C-Space

# ─── Truecolor (so tokyonight looks right) ───────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ─── Sanity / ergonomics ─────────────────────────────────────────────────────
set -s escape-time 0              # no lag on nvim Esc / mode changes
set -g mouse on                   # click panes, drag borders, wheel-scroll
set -g base-index 1               # windows start at 1 (matches the number row)
setw -g pane-base-index 1
set -g renumber-windows on        # keep window numbers gapless after closing one
set -g history-limit 50000        # bigger scrollback
set -g focus-events on            # let nvim autoread/gitsigns react to focus
setw -g mode-keys vi              # vi keys in copy mode

# ─── Friendlier splits ───────────────────────────────────────────────────────
# prefix |  → vertical split,  prefix -  → horizontal split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload this config: prefix r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ─── Pane navigation ─────────────────────────────────────────────────────────
# Outside nvim: plain C-h/j/k/l switch tmux panes directly.
# Inside nvim:  C-h/j/k/l belong to nvim (its own window nav, no escaping out);
#               to switch a tmux PANE while in nvim use the prefix:
#               C-Space then h/j/k/l (repeatable within the repeat-timeout).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# prefix + h/j/k/l: always switch tmux panes (this is the in-nvim path).
# NOTE: this rebinds the default `prefix l` (last-window) to "pane right".
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
